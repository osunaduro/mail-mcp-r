[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-mcp"
version = "0.1.0"
description = "Biblioteca unificada de gestión de correo + servidor MCP"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastmcp>=3.4,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
mail-mcp-stdio = "mcp_server.stdio:main"

[tool.setuptools.packages.find]
include = ["mail_core*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
