# Configuración de cuentas de correo
# Administrada exclusivamente por el administrador del sistema.
# La biblioteca es el único componente que lee este archivo.

accounts:
  personal:
    name: "Correo personal"
    email: "tu_correo@example.com"
    provider: imap_smtp
    options:
      imap_host: "imap.example.com"
      imap_port: 993
      imap_ssl: true
      smtp_host: "smtp.example.com"
      smtp_port: 465
      smtp_ssl: true
      username: "tu_correo@example.com"
      password: "TU_CONTRASEÑA_O_APP_PASSWORD"
      # Opcionales — carpetas especiales. Si se omiten se detectan solas
      # (SPECIAL-USE o nombres habituales como Drafts/Borradores, Sent/Enviados).
      # drafts_folder: "Drafts"
      # sent_folder: "Sent"
      # Guardar copia en Enviados después de cada envío. Por defecto true,
      # salvo Gmail y Office 365/Outlook, que ya la guardan solos.
      # save_sent: true
